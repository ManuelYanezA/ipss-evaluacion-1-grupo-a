<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistribuidorOnline</title>
    <link rel="stylesheet" href="./css/custom.css">
</head>
<body>
     <header>
        <input type="text" placeholder="Búsqueda de Productos">
    </header>
    
    <main>
        <h2>Recomendar Productos</h2>
        <section class="productos-grid">
            <article class="producto-card">
                <img src="./img/Placeholder producto.jpg" alt="Placeholder Producto" class="producto-image"><!-- Imagen del producto (Recordar cambiar el alt) -->
                <h3>Mancuernas 2.5 Kg</h3><!-- Nombre del producto -->
                <p>Mancuernas para realizar ejercicios de fortalecimiento muscular ligeros</p><!-- Descripción del producto -->
                <p class="precio">$14.990</p><!-- Precio del producto -->
            </article>
        </section>
    </main>

    <footer>
        <nav>
            <p>Página Principal</p>
            <p>Mis Pedidos</p>
            <p>Cliente</p>
        </nav>
    </footer>

</body>
</html>
