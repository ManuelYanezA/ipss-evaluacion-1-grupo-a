<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <title>Productos - DistribuidorOnline</title>
        <link rel="stylesheet" href="./css/custom.css">
    </head>
    <body>
        <!-- Encabezado usado en Index, excepto botones de tema y sumar 1 a carrito -->
        <header>
            <nav id="mainNavbar" class="navbar navbar-expand-sm navbar-light-theme">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">DistribuidoresOnline</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <ul class="navbar-nav align-items-center gap-4">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Mensajes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link position-relative" href="#">
                                <i class="bi bi-cart4" style="font-size: 1.2rem;"></i>
                                <span id="cartItemCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">
                                    0
                                </span>
                            </a>
                        </li>
                        <!-- Botones de cambio de Tema de NavBar -->
                        <li>
                            <div class="d-flex gap-2">
                                <button id="lightThemeBtn" type="button" class="btn btn-outline-dark" style="background-color: white; color: black; border-color:black;">Claro</button>
                                <button id="darkThemeBtn" type="button" class="btn btn-dark" style="background-color: black; color: white; border-color: black;">Oscuro</button>
                                <button id="redThemeBtn" type="button" class="btn text-white" style="background-color: rgb(180,35,35); color: white; border-color: black;">Rojo</button>
                            </div>
                        </li>
                        <!-- Botón de Agregar al Carrito (Sólo suma 1 a la burbuja de cantidad de elementos en el carro)-->
                        <li>
                            <button id="addToCartBtn" type="button" class="btn btn-primary"">Agregar al Carrito</button>
                        </li>
                    </ul>
                </div>
            </div>
            <!-- Barra de búsqueda de productos -->
            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Buscar productos..." aria-label="Search">
                <button class="btn btn-outline-success" type="submit">
                    <i class="bi bi-search"></i> Buscar
                </button>
            </form>
        </nav>
        </header>
        <!-- Contenido principal -->
        <main class="container mt-4">
            <h1 class="mb-4">Nuestros Productos</h1>
            <div id="productos" class="productos-grid">
                <!-- Ejemplo de producto, se elimina automáticamente al usar la función JS para obtener productos -->
                <div class="col">
                    <div class="card h-100 shadow-sm">
                        <img src="./img/Placeholder-producto.jpg" class="card-img-top" alt="Producto 1">
                        <div class="card-body">
                            <h5 class="card-title">Producto 1</h5>
                            <p class="card-text">Descripción breve del producto 1.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <!-- Pie de página -->
        <footer class="bg-light py-4 mt-5 border-top">
            <div class="container">
                <div class="row text-center">
                    <div class="col-md-4">
                        <a href="index.html" class="btn btn-success w-100">Pagina inicio</a>
                    </div>
                    <div class="col-md-4">
                        <a href="pedidos.html" class="btn btn-success w-100">Mis pedidos</a>
                    </div>
                    <div class="col-md-4">
                        <a href="cliente.html" class="btn btn-success w-100 ">Mi cuenta</a>
                    </div>
                </div>
            </div>
        </footer>

        <!-- Scripts de Bootstrap y de JS, se cambia a tipo "módulo" para que main.js pueda usar importaciones desde api.js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script type="module" src="./js/main.js"></script>
    </body>
</html>
