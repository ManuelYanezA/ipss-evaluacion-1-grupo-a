<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <title>Productos - DistribuidorOnline</title>
        <link rel="stylesheet" href="./css/custom.css">
    </head>
    <body>
        <header>
            <nav id="mainNavbar" class="navbar navbar-expand-sm navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">DistribuidoresOnline</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="collapsibleNavbar">
                        <ul class="navbar-nav align-items-center gap-4">
                            <li class="nav-item">
                                <a class="nav-link" href="#">Mensajes</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link position-relative" href="#">
                                    <i class="bi bi-cart4" style="font-size: 1.2rem;"></i>
                                    <span id="cartItemCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">
                                        0
                                    </span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        <main class="container mt-4">
            <h1 class="mb-4">Nuestros Productos</h1>
            <div class="row row-cols-1 row-cols-md-3 g-4">
                <!-- Ejemplo de producto -->
                <div class="col">
                    <div class="card h-100 shadow-sm">
                        <img src="./img/Placeholder-producto.jpg" class="card-img-top" alt="Producto 1">
                        <div class="card-body">
                            <h5 class="card-title">Producto 1</h5>
                            <p class="card-text">Descripción breve del producto 1.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
